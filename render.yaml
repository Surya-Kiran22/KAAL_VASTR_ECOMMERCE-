# Render Blueprint for the Kaal Vastr storefront.
#
# Render Blueprints have no `type: staticSite`. Per Render's own docs,
# a static site is declared as `type: web` with `runtime: static` and a
# `staticPublishPath`. This is a Vite SPA: the build produces plain
# HTML/CSS/JS in dist/, Supabase (hosted on Cloudflare) powers auth + the
# product catalogue, and Brevo SMTP dispatches verification emails. There is
# no long-running Node process.
#
# Deploy: connect this repo in Render -> Blueprint (render.yaml is auto-
# detected). Then copy your real values for the two `sync: false` variables
# below into the Render dashboard.

services:
  - type: web
    name: kaal-vastr-storefront
    runtime: static
    branch: master
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    # SPA fallback: deep links (e.g. /admin/register, /product/:id) serve
    # index.html so every route resolves instead of 404'ing on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Copy your real values here in the Render dashboard after the service
      # is created. These are injected at build time (Vite bakes them via
      # import.meta.env during `npm run build`).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
